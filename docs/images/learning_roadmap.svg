<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title description">
  <title id="title">深度学习入门八章学习路线</title>
  <desc id="description">从 Python 基础、感知机、神经网络、网络学习、反向传播、训练技巧、卷积神经网络到深度学习的完整路线。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="300" rx="22" fill="url(#background)"/>

  <text x="700" y="42" text-anchor="middle" fill="#f0f6fc" font-size="26" font-weight="700"
        font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    从零实现深度学习 · 学习路线
  </text>
  <text x="700" y="68" text-anchor="middle" fill="#8b949e" font-size="14"
        font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    基础编程 → 模型原理 → 自动学习 → 高效训练 → 计算机视觉
  </text>

  <g fill="none" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)" opacity="0.9">
    <path d="M 180 159 H 196"/>
    <path d="M 350 159 H 366"/>
    <path d="M 520 159 H 536"/>
    <path d="M 690 159 H 706"/>
    <path d="M 860 159 H 876"/>
    <path d="M 1030 159 H 1046"/>
    <path d="M 1200 159 H 1216"/>
  </g>

  <g filter="url(#shadow)" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(30 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#1f6feb"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">01</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">Python 基础</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">NumPy</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">Matplotlib</text>
    </g>

    <g transform="translate(200 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#1f6feb"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">02</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">感知机</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">权重 · 偏置</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">逻辑门</text>
    </g>

    <g transform="translate(370 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#1f6feb"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">03</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">神经网络</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">激活函数</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">前向传播</text>
    </g>

    <g transform="translate(540 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#58a6ff" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#1f6feb"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">04</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">网络学习</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">损失函数</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">梯度下降</text>
    </g>

    <g transform="translate(710 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#a371f7" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#8957e5"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">05</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">反向传播</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">计算图</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">链式法则</text>
    </g>

    <g transform="translate(880 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#a371f7" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#8957e5"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">06</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">训练技巧</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">优化 · 初始化</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">正则化</text>
    </g>

    <g transform="translate(1050 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#3fb950" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#238636"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">07</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">CNN</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">卷积 · 池化</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">im2col</text>
    </g>

    <g transform="translate(1220 96)">
      <rect width="150" height="126" rx="14" fill="url(#box)" stroke="#3fb950" stroke-width="2"/>
      <circle cx="24" cy="24" r="14" fill="#238636"/>
      <text x="24" y="29" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">08</text>
      <text x="75" y="61" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">深度学习</text>
      <text x="75" y="88" text-anchor="middle" fill="#8b949e" font-size="13">DeepConvNet</text>
      <text x="75" y="108" text-anchor="middle" fill="#8b949e" font-size="13">应用与展望</text>
    </g>
  </g>

  <text x="700" y="266" text-anchor="middle" fill="#8b949e" font-size="14"
        font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
    8 章 · 48 个 Python 示例 · 从零理解神经网络的计算与学习
  </text>
</svg>
